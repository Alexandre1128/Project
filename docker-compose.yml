version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: sporttips-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sporttips
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
volumes:
  postgres_data:
